services:
  api:
    build: ./apps/api
    restart: unless-stopped
    env_file: ./apps/api/.env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      clamav:
        condition: service_healthy
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version"]
      interval: 30s
      timeout: 10s
      retries: 10

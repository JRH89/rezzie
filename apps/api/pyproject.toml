[project]
name = "rezzie-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["alembic>=1.14.0", "anthropic>=0.40.0", "fastapi>=0.115.0", "httpx>=0.27.0", "psycopg[binary]>=3.2.0", "pypdf>=5.0.0", "pyjwt[crypto]>=2.10.0", "pydantic-settings>=2.6.0", "python-docx>=1.1.0", "python-multipart>=0.0.12", "sqlalchemy>=2.0.0", "stripe>=11.0.0", "uvicorn[standard]>=0.32.0"]

[dependency-groups]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
